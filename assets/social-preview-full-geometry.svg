<svg x="645" y="36" width="550" height="528.4" viewBox="0 0 510 490">
<title id="geometry-title">Proyección ortogonal de un vector sobre un subespacio</title>
<desc id="geometry-description">Un vector x en el espacio tridimensional V se proyecta ortogonalmente sobre el plano S generado por los dos primeros ejes. El segmento vertical representa la componente perpendicular al subespacio y el vector proyectado se etiqueta P sub S de x.</desc>
<circle class="geom-ring" stroke="#456962" cx="260" cy="266" fill="none" r="211" stroke-dasharray="3 9" stroke-width="1"></circle>
<circle class="geom-ring" stroke="#456962" cx="260" cy="266" fill="none" opacity=".52" r="169" stroke-width="1"></circle>
<!-- Affine orthographic drawing: O=(256,360), e1=(75,28), e2=(-55,34), e3=(0,-100).
     S=span(e1,e2) in R^3; x=0.6e1-0.2e2+1.25e3;
     P_S x=0.6e1-0.2e2. Screen points O=(256,360), P=(312,370), x=(312,245). -->
<clipPath id="plane-bound"><polygon points="225,264 458,351 287,456 54,369"></polygon></clipPath>
<g class="geom-grid" stroke="#7cb3a4" opacity=".39" clip-path="url(#plane-bound)" fill="none" stroke-linecap="round" stroke-width="1">
<path d="M70 363 L303 451 M92 349 L325 437 M113 336 L347 424 M135 322 L368 410 M157 309 L390 397 M178 295 L412 383 M200 282 L433 370"></path>
<path d="M218 280 L53 382 M255 294 L90 396 M292 308 L127 410 M329 322 L164 424 M366 336 L201 438 M403 350 L238 452"></path>
</g>
<polygon class="geom-plane" fill="#377a73" fill-opacity=".20" stroke="#90c7b5" points="225,264 458,351 287,456 54,369" stroke-linejoin="round" stroke-width="2"></polygon>
<g class="geom-axes" stroke="#75998e" fill="none" stroke-linecap="round" stroke-width="1.7">
<path d="M256 360 L390 410"></path><path d="M256 360 L158 421"></path><path d="M256 360 L256 168" stroke-dasharray="4 8"></path>
</g>
<path class="geom-vector" stroke="#e7a083" d="M256 360 L312 245" fill="none" stroke-linecap="round" stroke-width="3.4"></path>
<path class="geom-projection" stroke="#a1dfce" d="M256 360 L312 370" fill="none" stroke-linecap="round" stroke-width="3.4"></path>
<path class="geom-drop" stroke="#e7a083" d="M312 245 L312 370" stroke-dasharray="5 6" stroke-width="2"></path>
<circle class="geom-origin" fill="#e9f5ed" cx="256" cy="360" r="5.7"></circle><circle class="geom-vector-dot" fill="#e7a083" stroke="#183638" stroke-width="2" cx="312" cy="245" r="7"></circle>
<circle class="geom-proj-dot" fill="#a1dfce" stroke="#183638" stroke-width="2" cx="312" cy="370" r="6"></circle><circle class="geom-proj-halo" stroke="#7ab7ab" opacity=".85" cx="312" cy="370" fill="none" r="17" stroke-width="1.3"></circle>
<g class="geom-label" fill="#b0d2c6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">
<text x="235" y="385">0</text><text class="geom-vlabel" fill="#f1b79e" x="328" y="234">x</text>
<text class="geom-plabel" fill="#a4e1d0" x="333" y="391">P<tspan baseline-shift="sub" font-size="10">S</tspan> x</text>
<text class="geom-slabel" fill="#a1d8c7" x="105" y="411">S</text><text x="258" y="152">V = ℝ³</text>
</g>
</svg>
<g font-family="DejaVu Sans, Arial, sans-serif">
 <text x="78" y="130" fill="#afd0c4" font-size="20" font-weight="600" letter-spacing="1.5">PSICOLOGÍA · COGNICIÓN · COMPUTACIÓN</text>

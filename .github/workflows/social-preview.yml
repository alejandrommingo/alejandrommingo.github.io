name: Render social preview

on:
  push:
    paths:
      - 'assets/social-preview.svg'
      - 'favicon.svg'
      - '.github/workflows/social-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render local SVG to PNG
        run: |
          python -m pip install --quiet 'CairoSVG==2.7.1'
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='assets/social-preview.svg',
              write_to='assets/social-preview.png',
              output_width=1200,
              output_height=630,
          )
          cairosvg.svg2png(url='favicon.svg', write_to='favicon-32.png', output_width=32, output_height=32)
          cairosvg.svg2png(url='favicon.svg', write_to='apple-touch-icon.png', output_width=180, output_height=180)
          PY
      - name: Commit generated static image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/social-preview.png favicon-32.png apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m 'Render social preview PNG for link cards'
            git push
          fi
